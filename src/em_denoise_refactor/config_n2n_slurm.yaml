# Cluster Pipeline Configuration for SBF-SEM Noise2Noise (N2N) Overlap Training

experiment:
  name: "01_n2n_modunet_charbonnier_trimmed_ncc06_lr0.0004_20ep"
  output_dir: "/tachyon/groups/scratch/gmicro_sem/gfriedri/tgan/n2n_runs"

data:
  sbem_root: "/tachyon/groups/scratch/gmicro_sem/gfriedri/_EM_acquisitions/20260201_RoLi_F1/"
  grid_num: 0
  first_sec: 1250
  last_sec: 8000

splitting:
  strategy: "block"          # Full stack on cluster: volumetric Z-blocks + guard bands
  block_size: 100
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  guard_band_size: 5

extraction:
  patch_size: 128

n2n:
  enabled: true
  overlaps_dir: "/tachyon/groups/scratch/gmicro_sem/gfriedri/_processing/SOFIMA/nextflow/ganctoma/gfriedri-em-alignment-flows/runs/roli-f1/all-01240_22814/_inspect/overlaps/overlaps-n2n-training"
  pair_direction: "first_to_second"  # "first_to_second" keeps genuine single-exposure noise at input (recommended with align_subpixel)
  orientation: "all"
  max_train_pairs: 50000
  max_val_pairs: 10000
  max_test_pairs: 10000
  seed: 42
  augment_rot90: false
  align_patches: true
  align_subpixel: false           # true = two-stage sub-pixel phase cross-correlation + cubic spline shift (recommended with first_to_second)
  align_max_shift_px: 8           # Max shift (px) searched in each axis (6-8 is safer when real shifts are +-2 px)
  align_blur_sigma: 1.0
  patch_sampling: "tile"
  tile_stride: null
  trim_enabled: true
  v_trim_top_px: 50
  v_trim_left_px: 500
  v_trim_bottom_px: 0
  v_trim_right_px: 0
  h_trim_left_px: 32
  h_trim_top_px: 0
  h_trim_bottom_px: 0
  h_trim_right_px: 0
  quality_filter_enabled: true
  quality_metric: "ncc"
  min_pair_quality: 0.60
  quality_blur_sigma: 1.5
  min_patch_std: 0.0              # Optional min std on smoothed crop0 (e.g. 5.0) to drop flat/empty epoxy patches
  crop_cache_dir: null            # Optional path for persistent .npy mmap crop cache (instant <0.1s reloads + sub-range slicing)
  max_tiles_per_stripe: null      # Max kept patches/stripe in streaming tile mode (null = auto-scale for uniform shard coverage)
  prep_workers: 4                 # Threads for alignment & QA scoring per 64-stripe chunk during startup
  streaming: false                # Set true (with max_train_pairs: null) to stream all 2M+ pairs in <2 GB RAM
  shuffle_buffer_size: 2048

model:
  model_type: "residual_unet"     # "connectomics", "residual_unet", or "modern_unet"
  base_dim: 32

training:
  batch_size: 128
  epochs: 30
  learning_rate: 0.0005
  lr_scheduler: "cosine"
  lr_min: 0.000001
  warmup_epochs: 2
  seed: 42
  cache_in_ram: true              # Materializes compact aligned patches and frees full stripes
  samples_per_epoch: null         # Optional random subset per epoch when mmap cache has millions of patches
  device: "cuda"
  num_workers: 4
  save_all_epochs: false          # Keep checkpoint_last.pt + checkpoint_best.pt (fast on network FS)

loss:
  loss_type: "composite"
  mse_weight: 1.0
  edge_weight: 0.0
  ssim_weight: 0.0

inference:
  custom_input_dir: null          # Uses N2N test split; or set to cluster path of test_raw
  preview_image: null             # Optionally set to a cluster .tif path for per-epoch previews
  preview_crop_size: 512
