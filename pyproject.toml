[project]
name = "em-denoise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ganctoma", email = "gancarcik.tomas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scikit-image>=0.26.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "pydantic>=2.13.4",
    "tabulate>=0.10.0",
    "tqdm>=4.69.0",
    "tensorboard>=2.21.0",
    "torchvision>=0.28.0",
    # Imported across the codebase but previously undeclared, so a fresh `uv sync`
    # produced an environment that failed at import time.
    "tifffile>=2024.1.30",
    "pyyaml>=6.0",
    "pillow>=10.0",
    # Used by the Noise2Void CLI (src/em_denoise/n2v/train_n2v.py).
    "cyclopts>=3.0",
    "loguru>=0.7",
    "natsort>=8.4",
]

[project.scripts]
em-denoise = "em_denoise:main"
em-denoise-n2v = "em_denoise.n2v.train_n2v:app"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
